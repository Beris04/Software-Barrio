<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cero Grados v31</title>
<style>
:root{--bg:#f7efec;--card:#fffaf8;--ink:#271816;--muted:#725753;--line:#eadbd7;--brand:#873f38;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--gray:#64748b;--orange:#ea580c}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#0f172a;color:white;padding:18px;position:sticky;top:0;height:100vh}
.logo{width:135px;max-height:75px;object-fit:contain;margin-bottom:22px}
.nav{width:100%;border:0;border-radius:16px;background:transparent;color:white;text-align:left;padding:15px;font-weight:900;font-size:16px;margin:6px 0;cursor:pointer}
.nav.active{background:#2563eb}
.nav .badge{float:right;background:#ef4444;padding:3px 8px;border-radius:999px;font-size:12px}
.main{padding:18px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.scroll{height:calc(100vh - 36px);overflow:auto}
.summary{position:sticky;top:18px;height:calc(100vh - 36px);overflow:auto}
h1,h2,h3{margin:0 0 12px}
label{display:block;font-weight:900;margin:10px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;background:white}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:stretch}
.cardbtn{background:white;border:2px solid var(--line);border-radius:20px;min-height:118px;padding:16px;font-size:18px;font-weight:950;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;line-height:1.2}
.cardbtn.active{border-color:var(--blue);background:#eef6ff;color:#0b5ec8}
.icon{font-size:34px}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.slot,.flavor{background:white;border:2px solid var(--line);border-radius:18px;padding:14px;font-weight:950;cursor:pointer;text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center}
.slot.active,.flavor.active{border-color:var(--brand);background:#fff1f2}
.flavors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px;padding-bottom:4px}
.filter{border:0;background:white;border-radius:999px;padding:11px 18px;font-weight:950;cursor:pointer;white-space:nowrap;color:var(--ink);min-width:92px}
.filter.active{background:var(--brand);color:white}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.product.warn{background:#fff1f2}
.pname{font-size:15px;font-weight:950}
.pmeta{font-size:13px;color:var(--muted);margin-top:4px}
.qty{display:flex;align-items:center;gap:8px}
.qbtn{width:42px;height:42px;border:0;border-radius:14px;background:var(--brand);color:white;font-size:24px;font-weight:950;cursor:pointer}
.minus{background:var(--gray)}
.qnum{width:28px;text-align:center;font-size:24px;font-weight:950}
.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:9px 0}
.total{font-size:34px;font-weight:950;color:var(--brand)}
.primary,.secondary{width:100%;border:0;border-radius:16px;padding:16px;color:white;font-size:18px;font-weight:950;cursor:pointer;margin-top:12px}
.primary{background:var(--blue)}.secondary{background:var(--gray)}
.orders2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.orders3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.order{background:white;border:1px solid var(--line);border-left:8px solid var(--orange);border-radius:20px;padding:14px}
.order.entregado{border-left-color:var(--green)}
.order.no_entregado{border-left-color:var(--red);background:#fff1f2}
.orderhead{display:flex;justify-content:space-between;gap:10px}
.pill{display:inline-flex;border-radius:999px;background:#f5e5e1;color:var(--brand);padding:5px 10px;font-size:12px;font-weight:950}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:12px;color:white;padding:10px 12px;font-weight:950;cursor:pointer}
.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gray{background:var(--gray)}
.empty{border:1px dashed var(--line);border-radius:16px;background:white;padding:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.show{display:flex}
.modalbox{background:white;border-radius:22px;padding:18px;width:100%;max-width:850px;max-height:86vh;overflow:auto}
@media print{
 body *{visibility:hidden!important}
 #printTicket,#printTicket *{visibility:visible!important}
 #printTicket{display:block!important;position:absolute;left:0;top:0;width:80mm;background:white;color:black;padding:5mm;font-family:Arial,sans-serif}
}
@media(max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.grid{grid-template-columns:1fr}.summary{position:relative;height:auto}.scroll{height:auto}.flavors{grid-template-columns:repeat(2,1fr)}.orders2,.orders3{grid-template-columns:1fr}.products{grid-template-columns:1fr}}
</style>
</head>

E-DGB309-13089", "barcode": "", "group": "Orion", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t38", "name": "Vainilla Almond", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t39", "name": "Red Hat", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t40", "name": "Caramel Choco Sandwich", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t41", "name": "Choco Crunch", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t42", "name": "Nuts Berry Heart", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t43", "name": "White Choco Almond", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t44", "name": "Strawberry Cookie", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t45", "name": "Choco Cookie", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t46", "name": "Langue De Chat Roll", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t47", "name": "Florentins Cookie", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t48", "name": "Orion Bichobi Chocolate", "sku": "SE-DGB309-13907", "barcode": "", "group": "Orion", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}, {"id": "t49", "name": "White Choco Ball", "sku": "SE-DGB304-13844", "barcode": "", "group": "Galletas", "kind": "Premium", "extraPrice": 15, "oneAllowed": false}];
let filterGroup="Todos";
let orders=[];
let current={type:"helado",scoops:1,activeFlavor:0,flavors:[FLAVORS[0].id,FLAVORS[0].id],toppings:{},mochis:{}};

function money(n){return Number(n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN"})}
function getOrders(){return JSON.parse(localStorage.getItem("cero_v30_orders")||"[]")}
function saveOrders(data){localStorage.setItem("cero_v30_orders",JSON.stringify(data))}
function loadOrders(){orders=getOrders();renderAll()}

function view(v){
 document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));
 const idx={nuevo:0,entregas:1,historial:2}[v];
 document.querySelectorAll(".nav")[idx].classList.add("active");
 document.getElementById("viewNuevo").style.display=v==="nuevo"?"grid":"none";
 document.getElementById("viewEntregas").style.display=v==="entregas"?"block":"none";
 document.getElementById("viewHistorial").style.display=v==="historial"?"block":"none";
 renderAll();
}
function setType(t){
 current.type=t;
 document.getElementById("typeHelado").classList.toggle("active",t==="helado");
 document.getElementById("typeMochi").classList.toggle("active",t==="mochi");
 document.getElementById("heladoBlock").style.display=t==="helado"?"block":"none";
 document.getElementById("mochiBlock").style.display=t==="mochi"?"block":"none";
 renderAll();
}
function setScoops(n){current.scoops=n;if(n===1)current.activeFlavor=0;document.getElementById("size1").classList.toggle("active",n===1);document.getElementById("size2").classList.toggle("active",n===2);renderAll()}
function qty(obj,key,d){obj[key]=Math.max(0,(obj[key]||0)+d);if(obj[key]===0)delete obj[key];renderAll()}
function setFilter(g){filterGroup=g;renderFilters();renderToppings()}
function renderFlavors(){
 const f1=FLAVORS.find(f=>f.id===current.flavors[0])||FLAVORS[0]; const f2=FLAVORS.find(f=>f.id===current.flavors[1])||FLAVORS[0];
 document.getElementById("flavorSlots").innerHTML=`<div class="slot ${current.activeFlavor===0?'active':''}" onclick="current.activeFlavor=0;renderAll()">Bola 1<br><b>${f1.name}</b></div>`+(current.scoops===2?`<div class="slot ${current.activeFlavor===1?'active':''}" onclick="current.activeFlavor=1;renderAll()">Bola 2<br><b>${f2.name}</b></div>`:"");
 document.getElementById("flavors").innerHTML=FLAVORS.map(f=>`<div class="flavor ${current.flavors[current.activeFlavor]===f.id?'active':''}" onclick="current.flavors[current.activeFlavor]='${f.id}';renderAll()">${f.name}</div>`).join("");
}
function renderMochis(){document.getElementById("mochis").innerHTML=MOCHIS.map(m=>`<div class="product"><div><div class="pname">${m.name}</div><div class="pmeta">${money(m.price)}</div></div><div class="qty"><button class="qbtn minus" onclick="qty(current.mochis,'${m.id}',-1)">−</button><div class="qnum">${current.mochis[m.id]||0}</div><button class="qbtn" onclick="qty(current.mochis,'${m.id}',1)">+</button></div></div>`).join("")}
function renderFilters(){const groups=["Todos",...Array.from(new Set(TOPPINGS.map(t=>t.group)))];document.getElementById("filters").innerHTML=groups.map(g=>`<button class="filter ${filterGroup===g?'active':''}" onclick="setFilter('${g}')">${g}</button>`).join("")}
function renderToppings(){
 let arr=TOPPINGS; if(filterGroup!=="Todos")arr=arr.filter(t=>t.group===filterGroup);
 document.getElementById("toppings").innerHTML=arr.map(t=>{const bad=current.scoops===1&&!t.oneAllowed;return `<div class="product ${bad?'warn':''}"><div><div class="pname">${t.name}</div><div class="pmeta">${bad?'Extra en 1 bola':'Puede incluir'} · Extra ${money(t.extraPrice)}</div></div><div class="qty"><button class="qbtn minus" onclick="qty(current.toppings,'${t.id}',-1)">−</button><div class="qnum">${current.toppings[t.id]||0}</div><button class="qbtn" onclick="qty(current.toppings,'${t.id}',1)">+</button></div></div>`}).join("");
}
function calc(){
 let selected=[];Object.entries(current.toppings).forEach(([id,q])=>{const t=TOPPINGS.find(x=>x.id===id);for(let i=0;i<q;i++)selected.push(t)});
 let included=[],extras=[];selected.forEach(t=>{if(current.type==="helado"&&included.length<4&&(current.scoops===2||t.oneAllowed))included.push(t);else extras.push(t)});
 const f1=FLAVORS.find(f=>f.id===current.flavors[0])||FLAVORS[0]; const f2=FLAVORS.find(f=>f.id===current.flavors[1])||FLAVORS[0];
 const base=current.type==="helado"?(current.scoops===1?f1.price1:f1.price2):0;
 const flavor=current.type==="helado"?(current.scoops===1?f1:{name:`${f1.name} + ${f2.name}`,barcode:`${f1.barcode} / ${f2.barcode}`,flavors:[f1,f2]}):{name:"Solo Mochis",barcode:"MOCHI"};
 const mochiItems=Object.entries(current.mochis).map(([id,q])=>{const m=MOCHIS.find(x=>x.id===id);return {...m,qty:q,subtotal:q*m.price}});
 const extraTotal=extras.reduce((s,t)=>s+t.extraPrice,0); const mochiTotal=mochiItems.reduce((s,m)=>s+m.subtotal,0);
 return {base,flavor,included,extras,mochiItems,extraTotal,mochiTotal,total:base+extraTotal+mochiTotal};
}
function renderSummary(){const c=calc();let lines=[];if(current.type==="helado")lines.push(`<div class="line"><span>${current.scoops} bola(s) · ${c.flavor.name}</span><b>${money(c.base)}</b></div>`);else lines.push(`<div class="line"><span>Solo Mochis</span><b>$0.00</b></div>`);c.mochiItems.forEach(m=>lines.push(`<div class="line"><span>${m.qty} x ${m.name}</span><b>${money(m.subtotal)}</b></div>`));if(current.type==="helado"){lines.push(`<div class="line"><span>Toppings incluidos (${c.included.length}/4)</span><b>$0.00</b></div>`);c.included.forEach(t=>lines.push(`<div class="line"><span>✔ ${t.name}</span><b>Incluido</b></div>`))}lines.push(`<div class="line"><span>Extras (${c.extras.length})</span><b>${money(c.extraTotal)}</b></div>`);c.extras.forEach(t=>lines.push(`<div class="line"><span>+ ${t.name}</span><b>${money(t.extraPrice)}</b></div>`));document.getElementById("summary").innerHTML=lines.join("")||`<div class="empty">Sin productos</div>`;document.getElementById("total").textContent=money(c.total)}
function clearOrder(){current={type:"helado",scoops:1,activeFlavor:0,flavors:[FLAVORS[0].id,FLAVORS[0].id],toppings:{},mochis:{}};document.getElementById("customer").value="";document.getElementById("notes").value="";setType("helado");setScoops(1)}
function sendOrder(){const customer=document.getElementById("customer").value.trim();const c=calc();if(!customer)return alert("Captura nombre o mesa");if(c.total<=0)return alert("Agrega un producto");const order={id:"T"+Date.now(),created_at:new Date().toISOString(),customer,notes:document.getElementById("notes").value,type:current.type,scoops:current.type==="helado"?current.scoops:0,flavor:c.flavor,base:c.base,included:c.included,extras:c.extras,mochis:c.mochiItems,total:c.total,status:"ticket_impreso",history:[{event:"Ticket impreso",at:new Date().toLocaleString("es-MX")}]} ;const data=getOrders();data.unshift(order);saveOrders(data);printTicket(order);clearOrder();loadOrders();view("entregas")}
function buildTicket(o){let rows=[];if(o.scoops>0)rows.push(`<div><b>${o.scoops} bola(s)</b> ${o.flavor.name} <span>${money(o.base)}</span></div>`);(o.mochis||[]).forEach(m=>rows.push(`<div>${m.qty} x ${m.name} <span>${money(m.subtotal)}</span></div>`));if((o.included||[]).length){rows.push("<hr><b>INCLUIDOS</b>");o.included.forEach(t=>rows.push(`<div>✔ ${t.name}</div>`))}if((o.extras||[]).length){rows.push("<hr><b>EXTRAS</b>");o.extras.forEach(t=>rows.push(`<div>+ ${t.name} <span>${money(t.extraPrice)}</span></div>`))}return `<div style="text-align:center"><h2>CERO GRADOS 0°</h2><div>Ticket para pago en Caja</div><h1>#${String(o.id).slice(-5)}</h1></div><hr><b>Cliente/Mesa:</b> ${o.customer}<br><b>Fecha:</b> ${new Date().toLocaleString("es-MX")}<hr>${rows.join("")}<hr><div style="display:flex;justify-content:space-between;font-size:20px;font-weight:900"><span>TOTAL</span><span>${money(o.total)}</span></div><hr><div style="text-align:center;font-size:12px">Pagar en Caja y regresar ticket para entrega.</div>`}
function printTicket(o){const box=document.getElementById("printTicket");box.innerHTML=buildTicket(o);box.style.display="block";window.print();setTimeout(()=>box.style.display="none",500)}
function pill(s){return `<span class="pill">${s==="ticket_impreso"?"Ticket impreso":s==="entregado"?"Entregado":s==="no_entregado"?"No entregado":s}</span>`}
function orderHTML(o,mode){let rows=[];if(o.scoops>0)rows.push(`<div class="line"><span>${o.scoops} bola(s) · ${o.flavor.name}</span><b>${money(o.base)}</b></div>`);(o.mochis||[]).forEach(m=>rows.push(`<div class="line"><span>${m.qty} x ${m.name}</span><b>${money(m.subtotal)}</b></div>`));(o.included||[]).forEach(t=>rows.push(`<div class="line"><span>✔ ${t.name}</span><b>$0</b></div>`));(o.extras||[]).forEach(t=>rows.push(`<div class="line"><span>+ ${t.name}</span><b>${money(t.extraPrice)}</b></div>`));return `<div class="order ${o.status}"><div class="orderhead"><div><h3>${o.customer}</h3>${pill(o.status)}</div><div class="total">${money(o.total)}</div></div>${rows.join("")}<p>${o.notes||""}</p><div class="actions">${mode==="delivery"?`<button class="btn blue" onclick="reprint('${o.id}')">Reimprimir</button><button class="btn green" onclick="setStatusOrder('${o.id}','entregado')">Entregado</button><button class="btn red" onclick="setStatusOrder('${o.id}','no_entregado')">No entregado</button>`:`<button class="btn blue" onclick="detail('${o.id}')">Detalle</button>`}</div></div>`}
function renderDeliveries(){const arr=orders.filter(o=>o.status==="ticket_impreso");document.getElementById("deliveryOrders").innerHTML=arr.length?arr.map(o=>orderHTML(o,"delivery")).join(""):`<div class="empty">Sin tickets pendientes</div>`;document.getElementById("entregaCount").textContent=arr.length}
function renderHistory(){const arr=orders.filter(o=>o.status==="entregado"||o.status==="no_entregado");document.getElementById("historyOrders").innerHTML=arr.length?arr.map(o=>orderHTML(o,"history")).join(""):`<div class="empty">Sin historial</div>`}
function setStatusOrder(id,status){const data=getOrders();const i=data.findIndex(o=>o.id===id);if(i>=0){data[i].status=status;data[i].history=[...(data[i].history||[]),{event:status,at:new Date().toLocaleString("es-MX")}];saveOrders(data)}loadOrders()}
function reprint(id){const o=orders.find(x=>x.id===id);if(o)printTicket(o)}
function detail(id){const o=orders.find(x=>x.id===id);document.getElementById("codesContent").innerHTML=buildTicket(o);document.getElementById("codesModal").classList.add("show")}
function closeCodes(){document.getElementById("codesModal").classList.remove("show")}
function exportCSV(){const headers=["ID","Cliente","Estado","Total","Tipo","Sabor","Bolas"];const rows=orders.map(o=>[o.id,o.customer,o.status,o.total,o.type,o.flavor.name,o.scoops]);const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="historial_cero_grados.csv";a.click()}
function clearHistory(){if(confirm("¿Borrar pedidos locales?")){localStorage.removeItem("cero_v30_orders");loadOrders()}}
function renderAll(){renderFlavors();renderMochis();renderFilters();renderToppings();renderSummary();renderDeliveries();renderHistory()}
setType("helado");loadOrders();
</script>
